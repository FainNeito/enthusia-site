<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Guild banner fallback preview</title><meta name="description" content="Sample guild banner fallback preview."><link rel="stylesheet" href="../assets/enthusia.css"><style>body{margin:0;background:#fff1cf;color:#3a0d0a;font-family:Minecraft,monospace}main{max-width:720px;margin:auto;padding:24px}.panel{background:#a51b16;color:#fff6e0;border:4px solid #4a0b08;box-shadow:inset 0 0 0 4px #ffcf1f;padding:24px}.heading{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.banner{width:64px;height:128px;border:4px solid #4a0b08;image-rendering:pixelated}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{min-height:48px;padding:8px 16px;font:inherit;border:4px solid #4a0b08;background:#fff8e6;color:#3a0d0a}button[aria-pressed=true]{background:#ffcf1f}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#8a1510;min-width:110px;padding:12px}.note{line-height:1.6}</style></head><body><main><h1>Guild banner preview</h1><p class="note">Captured public Vibe banner; profile values are sample data. Choose a state to preview the fallback. No changes are saved.</p><div class="controls" role="group" aria-label="Preview state"><button type="button" id="ready" aria-pressed="true">Banner available</button><button type="button" id="missing" aria-pressed="false">Banner unavailable</button></div><section class="panel" aria-label="Sample guild profile"><div class="heading"><div id="banner"></div><div><p>GUILD PROFILE</p><h2>Vibe</h2></div></div><div class="stats"><div class="stat">Level<br>100</div><div class="stat">Members<br>24</div><div class="stat">Seasonal ELO<br>Not available</div></div><p id="status" class="note"></p></section></main><script src="../assets/guild-banner-renderer.js"></script><script type="module" src="guild-market-fallback-check.js"></script></body></html>
